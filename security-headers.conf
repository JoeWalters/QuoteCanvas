# Emitted on every response. Included at server level AND in each location that
# declares its own add_header, because add_header does not merge across levels:
# a location with any add_header of its own inherits none of the server's.
#
# style-src keeps 'unsafe-inline' because index.html uses 12 inline
# style="display: none;" attributes (lines 26, 60, 120, 138, 139, 362, 366,
# 388, 423, 439, 444, 470) that script.js toggles and reads via
# el.style.display, so converting them to a class would break those reads.
# 'unsafe-inline' is NOT allowed in script-src: all scripts are external.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
